# 用 GitHub Actions 做每日定时抓取  |  free daily cron via GitHub Actions
#
# 为什么用它：PaaS 免费套餐的实例会休眠，进程内定时器不可靠。
# GitHub Actions 的定时任务完全免费、独立于你的应用实例。
#
# 配置：
#   Settings → Secrets and variables → Actions 添加
#     APP_URL    = https://你的应用地址        (Repository secret)
#     ADMIN_TOKEN = 与 Web 服务一致的 token    (Repository secret，可选)
#
# 注意：GitHub 的 cron 用 UTC。下面 22:10 UTC = 北京时间次日 06:10。
name: daily-update

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:        # 也支持手动点按钮触发

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger remote update
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "未设置 APP_URL，跳过（请在仓库 Secrets 中配置）"
            exit 0
          fi
          python cron_update.py --url "$APP_URL" --token "$ADMIN_TOKEN" --wake
