# Render.com 部署配置  |  one-click deploy on Render
#
# 用法：
#   1. 把本目录推到 GitHub 仓库
#   2. Render → New → Blueprint → 选该仓库（会自动读取本文件）
#
# 关于免费套餐（重要）：
#   - Render 的 Cron Job **不支持 free 套餐**（只有 Starter 起）。
#     因此本配置只创建 1 个免费的 Web Service，每日更新改由
#     「进程内定时器」+「GitHub Actions 外部触发」两条免费途径完成。
#   - 免费 Web 实例闲置 15 分钟后休眠，下次访问约 30–60 秒冷启动。
#   - 免费实例无持久磁盘，容器重启后数据目录会清空，
#     但 AUTO_SEED=1 会在启动时自动重新抓取（约 90 秒），数据不会永久丢失。
services:
  - type: web
    name: vixvxn-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore            # 离国内较近；若该区域不可用可改 oregon / frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: LOG_DIR
        value: /data/logs
      - key: AUTO_SEED
        value: "1"
      # 打开进程内定时器：实例醒着时每天 06:10（北京时间）自动抓一次。
      # 休眠期间不会触发，但外部 GitHub Actions 会补上（见 .github/workflows/daily-update.yml）。
      - key: VIXVXN_SCHEDULER
        value: "1"
      - key: DAILY_HOUR
        value: "6"
      - key: DAILY_MINUTE
        value: "10"
      # 可选：设置后手动更新接口需要 ?token=xxx，防止陌生人反复触发抓取。
      # 建议在 Render 面板里填一个自己的值（这里留空表示不校验）。
      - key: ADMIN_TOKEN
        sync: false
